services:
  - type: web
    name: maxwell-brain
    runtime: node
    buildCommand: npm ci && npm run build
    startCommand: node dist/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: VECTOR_DB
        value: qdrant
      - key: QDRANT_URL
        sync: false  # set manually — point to Qdrant Cloud
      - key: QDRANT_API_KEY
        sync: false  # set manually — Qdrant Cloud requires this (local Qdrant didn't)
      - key: OPENAI_API_KEY
        sync: false  # set manually in dashboard
      - key: EMBEDDING_PROVIDER
        value: openai
      - key: ADMIN_API_KEY
        sync: false
      - key: API_KEYS
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false  # set manually — omit to leave voice unconfigured
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: CORS_ORIGINS
        sync: false  # set manually once the frontend's deployed URL is known
      - key: PERSONA_PATH
        value: ./data/persona/john_persona_curated.md
      - key: PERSONA_SNIPPETS_ENABLED
        value: true
